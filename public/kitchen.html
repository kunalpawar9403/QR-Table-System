<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Display System (KDS) | Spice Garden</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/kitchen.css">
</head>
<body class="kitchen-body">

  <!-- Demo Switcher Bar -->
  <header class="system-demo-bar">
    <div class="demo-bar-brand">
      <span>Smart Restaurant QR System</span>
    </div>
    <nav class="demo-bar-links">
      <a href="/index.html" class="demo-bar-link">Customer Scanner</a>
      <a href="/dashboard.html" class="demo-bar-link">Master Dashboard</a>
    </nav>
  </header>

  <!-- KDS Header Bar -->
  <header class="kds-header">
    <div class="kds-brand">
      <div class="kds-logo-icon">
        <svg class="svg-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
      </div>
      <div>
        <h1 class="kds-title">KITCHEN DISPLAY SYSTEM</h1>
        <div class="kds-live-indicator">
          <span class="kds-live-dot"></span>
          <span>Live WebSocket Feed</span>
        </div>
      </div>
    </div>

    <!-- Middle Filters -->
    <div class="kds-filter-tabs">
      <button class="kds-filter-tab active" data-filter="active">
        <span>Active</span>
        <span class="demo-badge-pill" id="activeCount">1 Active</span>
      </button>
      <button class="kds-filter-tab" data-filter="new">
        <span>New</span>
      </button>
      <button class="kds-filter-tab" data-filter="preparing">
        <span>Cooking</span>
      </button>
      <button class="kds-filter-tab" data-filter="ready">
        <span>Ready</span>
      </button>
      <button class="kds-filter-tab" data-filter="all">
        <span>All</span>
      </button>
    </div>

    <!-- Right Controls -->
    <div class="kds-controls">
      <button class="sound-toggle-btn" id="soundToggleBtn">
        <span>Chime Active</span>
      </button>
      <div class="kds-clock" id="kdsClock">12:00:00 PM</div>
    </div>
  </header>

  <!-- Service Alert Banner (Alerts kitchen/waiters) -->
  <aside class="service-call-banner" id="serviceAlertBanner" style="display: none;">
    <span id="serviceAlertText" style="font-weight: 700; font-size: 14px;">TABLE CALL RECEIVED</span>
    <button class="btn btn-secondary btn-sm" onclick="dismissServiceAlert()" style="background: white; color: #b45309;">
      Acknowledge
    </button>
  </aside>

  <!-- KDS Live Board -->
  <main class="kds-board" id="kdsBoard">
    <!-- Live order tickets rendered here -->
  </main>

  <!-- Toast Notification container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/audio.js"></script>
  <script src="/js/kitchen.js"></script>
</body>
</html>
